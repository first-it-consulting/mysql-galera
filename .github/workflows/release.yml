name: Release

on:
  push:
    branches: [main, master]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install release-please
        run: npm install -g release-please

      - name: Run release-please
        run: release-please release-pr --token ${{ secrets.GH_TOKEN }} --repo-url ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
