name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Run helm lint
        run: helm lint .

  template:
    name: Helm Template
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Run helm template (default values)
        run: helm template test . --set image.tag=8.0.42

      - name: Run helm template (custom values)
        run: helm template test . -f ci/test-values.yaml

  chart-test:
    name: Chart Tests
    runs-on: ubuntu-latest
    needs: [template]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Run helm test template
        run: helm template test . --set image.tag=8.0.42 --show-only templates/tests/test-connection.yaml
